<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="chai-logo-title">
  <title id="chai-logo-title">Chai</title>
  <defs>
    <linearGradient id="chai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4BE68"/>
      <stop offset="0.55" stop-color="#DE8B3C"/>
      <stop offset="1" stop-color="#A8492A"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#chai-bg)"/>

  <!-- shell prompt, rising like steam -->
  <path d="M46 24l11 9.5-11 9.5" fill="none" stroke="#FFF8EE" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="38" width="16" height="7" rx="3.5" fill="#FFF8EE" opacity="0.85"/>

  <!-- handle -->
  <path d="M89 66h7.5a10.5 10.5 0 0 1 0 21H88" fill="none" stroke="#FFF8EE"
        stroke-width="7" stroke-linecap="round"/>

  <!-- cup -->
  <path d="M33 59h61a3 3 0 0 1 3 3.5l-6.5 30A10 10 0 0 1 80.6 101H46.4a10 10 0 0 1-9.9-8.5L30 62.5A3 3 0 0 1 33 59Z"
        fill="#FFF8EE"/>

  <!-- tea -->
  <path d="M38 67h51" stroke="#C9752F" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- saucer -->
  <rect x="30" y="106" width="68" height="8" rx="4" fill="#FFF8EE" opacity="0.75"/>
</svg>
